<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Tracker: Google Trends & Prices</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Google Search Trends vs Stock Prices (6 months)</h1>

    <div id="statusBanner" class="banner hidden"></div>

    <div class="input-container">
        <input type="text" id="tickerInput" placeholder="Enter stock ticker" />
        <button id="fetchButton">Generate</button>
    </div>

    <div class="chart-container">
        <div>
            <h3>Google Search Trends <button class="reset-zoom" data-chart="trends">Reset zoom</button></h3>
            <canvas id="trendsChart" width="700" height="300"></canvas>
        </div>
        <div>
            <h3>Stock Price <button class="reset-zoom" data-chart="prices">Reset zoom</button></h3>
            <canvas id="pricesChart" width="700" height="300"></canvas>
        </div>
    </div>
    <p class="zoom-hint">Drag across a chart to zoom in · Ctrl + scroll or pinch to zoom · Shift + drag to pan</p>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
